  #stage { position: relative; width: 720px; height: 1280px; overflow: hidden; }

    position: absolute; left: calc(30px * var(--s, 1)); right: calc(30px * var(--s, 1)); top: calc(770px * var(--s, 1)); text-align: center;

    -webkit-text-stroke: calc(11px * var(--s, 1)) #0a0a0a; paint-order: stroke fill;
    text-shadow: 0 calc(6px * var(--s, 1)) 0 rgba(0,0,0,.5), 0 calc(12px * var(--s, 1)) calc(30px * var(--s, 1)) rgba(0,0,0,.45);
    transform-origin: 50% 55%; will-change: transform;
  }
  #cap .hl { color: #ffd43b; }
  #preload { position: absolute; opacity: 0; font: 700 20px 'Cap'; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  #hud { display: none; }
